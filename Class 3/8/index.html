<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Finance</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: #f4f4f9; 
            color: #333; 
            padding: 2rem; 
            display: flex;
            justify-content: center;
        }
        .card { 
            background: white; 
            padding: 2rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            width: 100%;
            max-width: 500px;
        }
        .balance { 
            font-size: 2.5rem; 
            font-weight: bold; 
            color: #2e7d32; 
            margin: 0.5rem 0 1.5rem 0; 
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
        }
        th, td { 
            padding: 0.75rem 0; 
            text-align: left; 
            border-bottom: 1px solid #eee; 
        }
        th { color: #666; font-weight: normal; font-size: 0.9rem; }
        .positive { color: #2e7d32; font-weight: 500; }
        .negative { color: #c62828; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top: 0;">Business Account</h2>
        <p style="color: #666; margin-bottom: 0;">Current Balance</p>
        <div class="balance">$42,500.00</div>
        
         <!-- Start: Students work starting from here  -->
         
         <!-- End -->
    </div>
</body>
</html>
